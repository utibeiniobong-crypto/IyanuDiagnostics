.iyanu-portal{position:relative;z-index:9999;background:linear-gradient(90deg,#071a16 0%,#0b2e26 52%,#071a16 100%);border-bottom:1px solid rgba(212,180,122,.35);box-shadow:0 8px 24px rgba(0,0,0,.18);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}

.iyanu-links{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap}
.iyanu-links a{display:inline-block!important;padding:7px 10px;border-radius:8px;text-decoration:none!important;color:#dbe9e3!important;font-size:12px;font-weight:700;transition:.18s ease}
.iyanu-links a:hover,.iyanu-links a:focus-visible{color:#f1d9a0!important;background:rgba(212,180,122,.12);outline:none}
@media(max-width:760px){.iyanu-portal-inner{align-items:flex-start;flex-direction:column;padding:9px 12px}.iyanu-links{width:100%;justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}.iyanu-links a{white-space:nowrap}}

nge snakes in water, seductive water encounters, rivers with crocodiles.",deliveranceAction:"Renounce any marine covenants or dedications. Command every water-based embargo to break in Jesus' name."},{id:"law_5",name:"Law of Agreement",scripture:"Amos 3:3, Matthew 18:19, 2 Corinthians 6:14-17",meaning:"Can two walk together except they be agreed? Spiritual agreement gives authority. Agreement with fear, defeat, or ungodly suggestions invites oppression.",dreamClues:"Signing documents, shaking hands with shadowy figures, eating at strange banquets, saying yes to strangers.",deliveranceAction:"Nullify any dream-induced agreements, contracts, or evil handshakes by the power of the blood of Jesus."},{id:"law_6",name:"Law of the Tongue & Seeds",scripture:"Proverbs 18:21, Mark 4:14, Galatians 6:7",meaning:"Death and life are in the power of the tongue. Spoken words and dream declarations are spiritual seeds that yield after their kind.",dreamClues:"Mouth sewn shut, seeds, planting, harvest, eating bitter fruit, speaking curses.",deliveranceAction:"Uproot negative self-confessions and decrees spoken over your destiny. Decree God's promises boldly."},{id:"law_7",name:"Law of Household Authority",scripture:"Joshua 24:15, Micah 7:6, Matthew 10:36",meaning:"Spiritual authority and generational patterns operate through family proximity and bloodlines. Deliverance breaks generational cycles of hardship.",dreamClues:"Family compound, deceased relatives speaking, parents' old belongings, sibling disputes.",deliveranceAction:"Stand in the gap for your household. Decree that ancestral yokes stop at your generation."},{id:"law_8",name:"Law of Spiritual Blindness",scripture:"2 Corinthians 4:4, Psalm 119:18, Revelation 3:18",meaning:"The enemy attempts to blind believers to God's divine purpose and spiritual direction. God's light brings illumination and clarity.",dreamClues:"Blindfolds, dark rooms, lost spectacles, thick fog, inability to read Scripture.",deliveranceAction:"Pray: 'Lord, open my eyes that I may behold wondrous things out of Your law.' Anoint your eyes with spiritual discernment."},{id:"law_9",name:"Law of the Stumbling Block",scripture:"Romans 14:13, Revelation 2:14, Matthew 18:8-9",meaning:"A trap or temptation designed to cause spiritual compromise, sexual fall, or offense. It often looks like a shortcut or attractive gift.",dreamClues:"Pit, concealed wire, seductive stranger, counterfeit gold, delicious poisoned food.",deliveranceAction:"Ask God for holy discernment. Avoid spiritual shortcuts and walk in uncompromising righteousness."},{id:"law_10",name:"Law of Peace & Divine Flow",scripture:"Colossians 3:15, Philippians 4:7, Psalm 23:2",meaning:"Peace is the spiritual umpire. The Holy Spirit's guidance produces supernatural peace and clarity, while enemy attacks bring turmoil and confusion.",dreamClues:"Still waters, green pastures, gentle breezes, radiant morning sun, clear pathways.",deliveranceAction:"Follow the peace of God. Rest in His divine provision and reject anxiety."}];var ms="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIbGNtcwIQAABtbnRyUkdCIFhZWiAH4gADABQACQAOAB1hY3NwTVNGVAAAAABzYXdzY3RybAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWhhbmSdkQA9QICwPUB0LIGepSKOAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAABxjcHJ0AAABDAAAAAx3dHB0AAABGAAAABRyWFlaAAABLAAAABRnWFlaAAABQAAAABRiWFlaAAABVAAAABRyVFJDAAABaAAAAGBnVFJDAAABaAAAAGBiVFJDAAABaAAAAGBkZXNjAAAAAAAAAAV1UkdCAAAAAAAAAAAAAAAAdGV4dAAAAABDQzAAWFlaIAAAAAAAAPNUAAEAAAABFslYWVogAAAAAAAAb6AAADjyAAADj1hZWiAAAAAAAABilgAAt4kAABjaWFlaIAAAAAAAACSgAAAPhQAAtsRjdXJ2AAAAAAAAACoAAAB8APgBnAJ1A4MEyQZOCBIKGAxiDvQRzxT2GGocLiBDJKwpai5+M+s5sz/WRldNNlR2XBdkHWyGdVZ+jYgskjacq6eMstu+mcrH12Xkd/H5////2wBDABALDA4MChAODQ4SERATGCgaGBYWGDEjJR0oOjM9PDkzODdASFxOQERXRTc4UG1RV19iZ2hnPk1xeXBkeFxlZ2P/2wBDARESEhgVGC8aGi9jQjhCY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2P/wAARCAQ4BDgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFB
